<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><link rel="icon" href="data:,"><title>Garden model review</title>
<style>body{margin:0;background:#101923;color:#e9e1ce;font:14px Georgia,serif}canvas{display:block}#labels{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);pointer-events:none}.label{display:flex;justify-content:center;align-items:flex-end;padding:20px;box-sizing:border-box;border:1px solid #23313e}small{color:#9aa8b6;margin-left:12px}</style>
<div id="labels"></div><script type="module">
import * as T from 'three';
import { GARDEN_DECO_DEFINES } from '../src/game/ugc/DecoDefine.ts';
import { createDecoObject } from '../src/features/ugc/decor/DecoFactory.ts';
T.ColorManagement.enabled=false;
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.outputColorSpace=T.LinearSRGBColorSpace;
renderer.setSize(1600,1200);renderer.setScissorTest(true);document.body.append(renderer.domElement);
const entries=GARDEN_DECO_DEFINES.map((def,i)=>{
 const scene=new T.Scene();scene.background=new T.Color(0x15212c);
 const model=createDecoObject(def,0);scene.add(model);
 const box=new T.Box3().setFromObject(model),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());
 const extent=Math.max(size.z*1.42,size.x*1.28,14);
 const camera=new T.OrthographicCamera(-extent*.5,extent*.5,extent*.5,-extent*.5,.1,200);
 camera.up.set(0,0,1);camera.position.set(24,-48,28).add(center);camera.lookAt(center);
 const label=document.createElement('div');label.className='label';label.innerHTML=`${def.name}<small>${def.w}×${def.d} · ${def.rarity}</small>`;document.querySelector('#labels').append(label);
 return {scene,camera,x:(i%4)*400,y:(2-Math.floor(i/4))*400};
});
function frame(){for(const e of entries){renderer.setViewport(e.x,e.y,400,400);renderer.setScissor(e.x,e.y,400,400);renderer.render(e.scene,e.camera);}window.reviewReady=true;requestAnimationFrame(frame);}frame();
</script></html>
